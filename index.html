<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CEMT</title>
    <script>
      (function () {
        var ac = window.applicationCache;
        if (ac && ac.status === ac.UNCACHED) {
          window.location.replace("cache.html");
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: linear-gradient(135deg, #063fab 0%, #01258a 58%, #001b70 100%);
        color: #fff;
        font:
          18px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 34%, rgba(255, 255, 255, 0.16), transparent 32%),
          linear-gradient(120deg, transparent 0 48%, rgba(255, 255, 255, 0.035) 48% 49%, transparent 49%);
      }
      #brand {
        text-align: center;
        padding: 14px 10px;
        background: rgba(0, 20, 104, 0.2);
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        position: relative;
        z-index: 1;
      }
      #brand img {
        height: 28px;
        width: auto;
        margin-right: 8px;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #fff;
        vertical-align: middle;
      }

      /* running: the PlayStation logo glows while jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 240px;
        height: 260px;
        margin: -130px 0 0 -120px;
        display: grid;
        place-items: center;
        animation: logoGlow 1.4s ease-in-out infinite;
      }
      #spin .ps-logo {
        width: 240px;
        height: auto;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.35));
      }
      #loadingLabel {
        margin-top: 55px;
        font-size: 40px;
        font-weight: 700;
        white-space: nowrap;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }
      @keyframes logoGlow {
        0%, 100% {
          opacity: 0.58;
          filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.25));
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.95));
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.3px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        display: none;
      }
      #wrap {
        padding: 0;
        position: relative;
        z-index: 1;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.done #loadingLabel,
      body.fail #loadingLabel,
      body.log #loadingLabel {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        font-size: 24px;
        font-weight: 700;
        color: #b9ffd0;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img
        src="cemt.png"
        alt=""
        height="28"
      src="cemt.png" 
      /><b>CEMT +5354112154</b>
    </div>
    <script>document.querySelector("#brand img").src = "cemt.png";</script>
    <div id="spin">
      <svg class="ps-logo" xmlns="http://www.w3.org/2000/svg" viewBox="4.3 9.5 41.1 31" aria-label="PlayStation">
        <path d="M5.8 32.1c-1.5 1-1 2.9 2.2 3.8 3.3 1.1 6.9 1.4 10.4.8.2 0 .4-.1.5-.1v-3.4l-3.4 1.1c-1.3.4-2.6.5-3.9.2-1-.3-.8-.9.4-1.4l6.9-2.4V27l-9.6 3.3c-1.2.4-2.4 1-3.5 1.8zm23.2-15v9.7c4.1 2 7.3 0 7.3-5.2 0-5.3-1.9-7.7-7.4-9.6C26 11 23 10.1 20 9.5v28.9l7 2.1V16.2c0-1.1 0-1.9.8-1.6 1.1.3 1.2 1.4 1.2 2.5zm13 12.7c-2.9-1-6-1.4-9-1.1-1.6.1-3.1.5-4.5 1l-.3.1v3.9l6.5-2.4c1.3-.4 2.6-.5 3.9-.2 1 .3.8.9-.4 1.4l-10 3.7V40L42 34.9c1-.4 1.9-.9 2.7-1.7.7-1 .4-2.4-2.7-3.4z" fill="white" />
      </svg>
      <div id="loadingLabel">Cargando exploit...</div>
    </div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script src="./bundle.js"></script>
  </body>
</html>
